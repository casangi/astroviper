[project]
name = "astroviper"
version = "0.0.37"
description = "Astro Visibility and Image Parallel Execution Reduction "
authors = [{ name = "Jan-Willem Steeb", email = "jsteeb@nrao.edu"},
    {name = "Dave Mehringer", email="dmehring@nrao.edu"},
    {name = "Kumar Golap", email="kgolap@nrao.edu"},
    {name = "Takahiro Tsutsumi", email="ttsutsum@nrao.edu"},
    {name = "Srikrishna Sekhar", email="ssekhar@nrao.edu"},
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.11,<3.14"

# ✅ Core runtime dependencies must live here
dependencies = [
  "graphviper>=0.0.44",
  "numpy>=1.20.0",
  "xradio[zarr]>=1.2.1",
  "numba",
  "opt_einsum",
  "pyfftw",
  "graphviz"
]

[project.optional-dependencies]
python_casacore = [
  "python_casacore>=3.6.1; sys_platform != 'darwin'"
]

interactive = [
  "matplotlib",
  "prettytable",
  "jupyterlab",
  "ipykernel",
  "ipympl",
  "ipython",
  "jupyter-client",
  "bokeh",
  "holoviews"
]

docs = [
  "nbsphinx",
  "recommonmark",
  "scanpydoc",
  "sphinx-autoapi",
  "sphinx-autosummary-accessors",
  "sphinx_rtd_theme",
  "twine",
  "pandoc",
]

all = [
  "python_casacore>=3.6.1; sys_platform != 'darwin'",
  "pytest",
  "pytest-cov",
  "pytest-html",
  "matplotlib",
  "prettytable",
  "jupyterlab",
  "ipykernel",
  "ipympl",
  "ipython",
  "jupyter-client",
  "nbsphinx",
  "recommonmark",
  "scanpydoc",
  "sphinx-autoapi",
  "sphinx-autosummary-accessors",
  "sphinx_rtd_theme",
  "twine",
  "pandoc",
  "pre-commit",
  "nbstripout",
  "memory_profiler"
]

[build-system]
# Include numpy so headers are present at build time
requires = [
  "scikit-build-core>=0.5.0",
  "pybind11>=2.10.0",
  "setuptools",
  "wheel",
  "numpy>=1.20.0"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
# With a src/ layout, list the import package name(s)
wheel.packages = ["src/astroviper"]

[tool.scikit-build.cmake]
# CMAKE_BUILD_TYPE for the C++ extensions. This is the lever for optimization /
# debug flags: the shared cmake/AstroviperPybind.cmake intentionally leaves
# opt-level to CMake instead of hand-rolling -O3. The reproducibility/standard
# flags (-std=c++23, -ffp-contract, -stdlib=libc++, threads) apply regardless.
#   Release        -> -O3 -DNDEBUG          (normal/CI; asserts off)
#   Debug          -> -g (i.e. -O0)         (gdb/lldb; asserts + pybind checks on)
#   RelWithDebInfo -> -O2 -g -DNDEBUG       (profiling with symbols)
#   MinSizeRel     -> -Os -DNDEBUG          (smallest binary)
# Override for one build without editing this file (Release stays the default):
#   pip install -e . --no-build-isolation --config-settings=cmake.build-type=Debug
#   SKBUILD_CMAKE_BUILD_TYPE=Debug pip install -e . --no-build-isolation
# If a switch behaves oddly (stale cache), delete build/ and reinstall.
build-type = "Release"

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.cmake.define]
PYBIND11_FINDPYTHON = "ON"

# (Optional) This block is ignored by scikit-build-core; safe to delete.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Silence noisy, non-actionable zarr V3 warnings across the whole test suite.
# pytest's per-test warning capture resets import-time filters, so these must be
# set here rather than only in src/astroviper/__init__.py (which covers
# non-pytest runtime use). The first is matched by its specific category; the
# second is matched by message because its category (zarr.errors.ZarrUserWarning)
# is a broad base class we do not want to silence wholesale.
filterwarnings = [
    # Fixed-length UTF string dtypes (XRADIO Zarr stores) have no stable V3 spec.
    "ignore::zarr.errors.UnstableSpecificationWarning",
    # Consolidated metadata is not yet part of the Zarr V3 spec.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
]
