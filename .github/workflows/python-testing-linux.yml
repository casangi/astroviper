# Run Linux tests using template in ToolVIPER
name: Linux Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  call-testing-linux:
    uses: nrao/gh-actions-templates-public/.github/workflows/python-testing-linux-template.yml@main
    with:
      cov_project: "astroviper"
      test-path: "tests/"
      # astroviper's C++ extensions require C++23 (GCC >= 14).
      gcc-version: "14"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
