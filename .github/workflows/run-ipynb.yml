# .github/workflows/python-testing-linux.yml
# Test all notebooks.
name: ipynb Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:

  call-testing-linux:
    uses: nrao/gh-actions-templates-public/.github/workflows/run-ipynb-template.yml@main
    with:
      # astroviper's C++ extensions require C++23 (GCC >= 14).
      gcc-version: "14"
    secrets: inherit
