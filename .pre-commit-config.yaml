repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--chars,"  "]

  - repo: https://github.com/asottile/pyupgrade
    rev: v2.38.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus

  -   repo: https://github.com/MarcoGorelli/absolufy-imports
      rev: v0.3.1
      hooks:
      - id: absolufy-imports
        name: absolufy-imports

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check        # import sorting (isort replacement; see [tool.ruff.lint])
        args: [--fix]
      - id: ruff-format       # formatter (black replacement)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Verify the shared imaging-parameter docstrings are in sync with the central
  # registry (src/astroviper/processing_functions/imaging/_param_docs.py).
  # Runs the tool as a standalone script so only libcst is needed (no package
  # build / C++ compile); fix drift with `python -m astroviper.utils.param_docs sync`.
  - repo: local
    hooks:
      - id: imaging-param-docs
        name: imaging parameter docstring sync check
        entry: python src/astroviper/utils/param_docs.py check
        language: system
        pass_filenames: false
        files: >-
          ^src/astroviper/(distributed_applications|node_tasks|processing_functions)/imaging/.*\.py$|^src/astroviper/utils/param_docs\.py$
